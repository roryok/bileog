app-id: com.roryok.bileog
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: bileog
separate-locales: false

# Deliberately minimal. Bileog makes no network requests, plays no audio and
# reads no files outside its own data directory, so it asks for none of those.
# The two file dialogs (cover picker, story export) go through the XDG desktop
# portal, which needs no filesystem permission of its own.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    NPM_CONFIG_LOGLEVEL: info

modules:
  - name: bileog
    buildsystem: simple
    subdir: main

    build-options:
      env:
        XDG_CACHE_HOME: /run/build/bileog/flatpak-node/cache
        npm_config_cache: /run/build/bileog/flatpak-node/npm-cache
        npm_config_offline: 'true'
        # @electron/rebuild hardcodes its headers directory as
        # path.resolve(os.homedir(), '.electron-gyp') and assigns it straight
        # onto node-gyp, so npm_config_devdir cannot redirect it. Pinning HOME
        # into the build tree is the only handle on it, and keeps the build from
        # depending on the builder's real home directory.
        HOME: /run/build/bileog/flatpak-node

    build-commands:
      # better-sqlite3's install script is `prebuild-install || node-gyp
      # rebuild`. Offline, prebuild-install cannot reach GitHub, so node-gyp
      # compiles it - and node-gyp needs the SDK's *node* headers, which are not
      # vendored (generated-sources.json carries Electron's). This generated
      # script links them into the cache. It uses relative paths, so it has to
      # run from the build root rather than from main/.
      - (cd .. && . flatpak-node/setup_sdk_node_headers.sh)

      # Point @electron/rebuild's hardcoded ~/.electron-gyp at the vendored
      # Electron headers, which generated-sources.json already placed in
      # $XDG_CACHE_HOME/node-gyp/33.4.11 complete with an installVersion marker.
      # Without this it tries to fetch them and dies on EAI_AGAIN.
      - ln -sfn "$XDG_CACHE_HOME/node-gyp" "$HOME/.electron-gyp"

      # Every dependency is vendored in generated-sources.json; the build has
      # no network access.
      - npm install --offline

      # electron-builder 26 does not look for Electron where the generator
      # vendored it: it passes its own cache ($XDG_CACHE_HOME/electron-builder)
      # as the cacheRoot, misses, and reaches for github.com. Rather than chase
      # its cache layout, skip the download path altogether - electronDist takes
      # an already-extracted Electron and never calls @electron/get.
      #
      # Verified offline on a cold cache: zero network fetches, linux-unpacked
      # produced. This also covers the icons toolset, which is fetched from
      # electron-builder-binaries on the normal path.
      - |
        set -e
        EV=$(node -p "require('./node_modules/electron/package.json').version")
        case "$FLATPAK_ARCH" in
          x86_64)  EA=x64 ;;
          aarch64) EA=arm64 ;;
          arm)     EA=armv7l ;;
          i386)    EA=ia32 ;;
          *) echo "unhandled FLATPAK_ARCH: $FLATPAK_ARCH" >&2; exit 1 ;;
        esac
        ZIP="$XDG_CACHE_HOME/electron/electron-v$EV-linux-$EA.zip"
        test -f "$ZIP" || { echo "vendored Electron missing: $ZIP" >&2; exit 1; }
        mkdir -p /run/build/bileog/electron-dist
        unzip -q -o "$ZIP" -d /run/build/bileog/electron-dist

      # electron-builder-arch-args.sh maps the Flatpak arch onto the right
      # --x64/--arm64 flag so the same manifest builds on every architecture.
      - |
        . ../flatpak-node/electron-builder-arch-args.sh
        npm run dist:linux -- $ELECTRON_BUILDER_ARCH_ARGS \
          --config.electronDist=/run/build/bileog/electron-dist

      - cp -a dist/linux*unpacked /app/main

      # Launcher. zypak redirects Chromium's SUID sandbox onto the Flatpak
      # sandbox; without it the app will not start.
      - install -Dm755 -t /app/bin/ ../bileog

      - install -Dm644 flatpak/com.roryok.bileog.metainfo.xml /app/share/metainfo/com.roryok.bileog.metainfo.xml
      - install -Dm644 flatpak/com.roryok.bileog.desktop /app/share/applications/com.roryok.bileog.desktop
      - install -Dm644 src/assets/icons/leaf.svg /app/share/icons/hicolor/scalable/apps/com.roryok.bileog.svg
      - |
        for s in 128 256 512; do
          install -Dm644 "build/icons/${s}x${s}.png" \
            "/app/share/icons/hicolor/${s}x${s}/apps/com.roryok.bileog.png"
        done

    sources:
      # Flathub requires a pinned remote source. Replace the commit with the
      # SHA that v1.0.0 points at once the repository is published.
      - type: git
        url: https://github.com/roryok/bileog.git
        tag: v1.0.0
        commit: 8824b1811950b80bedd7c5f11d08f718e2e1be2e
        dest: main

      - generated-sources.json

      - type: script
        dest-filename: bileog
        commands:
          - zypak-wrapper.sh /app/main/bileog "$@"
