appId: com.roryok.bileog
productName: Bileog
copyright: Copyright © 2026 Rory O'Kelly

directories:
  buildResources: build
  output: dist

# Negation-only patterns so electron-builder's defaults (which pull in
# production node_modules) still apply.
files:
  - '**/*'
  - '!src/*'
  - '!out/**/*.map'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!tsconfig*.json'
  - '!**/*.tsbuildinfo'
  - '!.claude/*'
  # Packaging metadata and docs for other platforms have no business inside the
  # macOS app: the Flathub manifest, its vendored source list and its
  # screenshots came to 3.3 MB of dead weight.
  - '!flatpak/**'
  - '!roadmap.html'
  - '!build/icons/**'
  # The renderer is fully bundled by Vite and the main process externalises only
  # better-sqlite3 and nanoid, so nothing else in node_modules is reachable at
  # runtime. Shipping the rest would bloat the bundle and, more importantly,
  # drag ~105 packages of third-party licensing into a released binary for no
  # reason - including install-time HTTP clients pulled in by prebuild-install.
  - '!node_modules/**'
  - 'node_modules/better-sqlite3/**'
  - 'node_modules/bindings/**'
  - 'node_modules/file-uri-to-path/**'
  - 'node_modules/nanoid/**'
  # These must come after the re-include above: patterns are applied in order,
  # so putting them earlier let 'node_modules/better-sqlite3/**' undo them.
  # better-sqlite3 ships its whole build tree - node-gyp intermediates and the
  # vendored SQLite C sources - when only the compiled addon runs.
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/build/**'
  - 'node_modules/better-sqlite3/build/Release/better_sqlite3.node'

# The SIL OFL requires its license text to accompany the bundled fonts, and the
# Pexels attribution should travel with the app too. Vite only emits the .woff2
# files, so these are copied in explicitly.
extraResources:
  - from: LICENSE
    to: licenses/LICENSE
  - from: NOTICE
    to: licenses/NOTICE
  - from: src/renderer/src/fonts/OFL-Baloo2.txt
    to: licenses/OFL-Baloo2.txt
  - from: src/renderer/src/fonts/OFL-Quicksand.txt
    to: licenses/OFL-Quicksand.txt
  # Electron does not copy these into the .app on macOS, but Chromium is
  # BSD-3-Clause and its dependencies require notice retention, so a
  # redistributed binary has to carry them.
  - from: node_modules/electron/dist/LICENSE
    to: licenses/LICENSE.electron
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html

# better-sqlite3 is a native .node addon: it must live on the real filesystem,
# not inside app.asar, or dlopen() can't load it.
asarUnpack:
  - '**/node_modules/better-sqlite3/build/Release/better_sqlite3.node'

mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch:
        - arm64
  # No Developer ID cert available, so ad-hoc sign ("-") instead. This produces a
  # valid signature so the arm64 app will launch, but it is not notarized, so the
  # receiving Mac has to clear the quarantine flag once (see INSTALL.md).
  identity: '-'
  # Hardened runtime only matters for notarization, and it blocks ad-hoc-signed
  # apps from loading the better-sqlite3 addon (library validation).
  hardenedRuntime: false
  darkModeSupport: true
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Rory OK

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# Electron ships ~160 locale bundles, 40 MB of the framework. The app has no
# translations, so only English is meaningful.
electronLanguages:
  - en
  - en-GB

linux:
  # Flatpak is the only Linux channel we target, and flatpak-builder installs
  # from the unpacked directory, so no distro packages are produced here.
  target:
    - dir
  category: Office
  synopsis: A distraction-free story writing app for kids
  description: >-
    Bileog gives children a calm, full-screen place to write stories. Every
    story gets a cover, autosaves as they type, and keeps a timeline of earlier
    versions they can look back through.
  desktop:
    entry:
      Name: Bileog
      Categories: Office;WordProcessor;
      Keywords: writing;stories;kids;children;journal;
